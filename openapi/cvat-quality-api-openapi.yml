components:
  schemas:
    QualityReportRequirementSummaryItem:
      type: object
      properties:
        requirement_id:
          type:
          - integer
          - 'null'
        name:
          type: string
        metric:
          $ref: '#/components/schemas/QualityTargetMetric'
