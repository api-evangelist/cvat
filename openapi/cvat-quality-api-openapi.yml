openapi: 3.2.0
info:
  title: CVAT REST Quality API
  version: 2.79.0 (2.0)
  description: REST API for Computer Vision Annotation Tool (CVAT)
  termsOfService: https://www.google.com/policies/terms/
  contact:
    name: CVAT.ai team
    url: https://github.com/cvat-ai/cvat
    email: support@cvat.ai
  license:
    name: MIT License
    url: https://en.wikipedia.org/wiki/MIT_License
tags:
- name: quality
paths:
  /api/quality/conflicts:
    get:
      operationId: quality_list_conflicts
      summary: List annotation conflicts in a quality report
      parameters:
      - name: X-Organization
        in: header
        description: 'Organization unique slug.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A non-empty value selects that organization.

          '
        schema:
          type: string
        allowEmptyValue: true
      - name: filter
        required: false
        in: query
        description: "\nJSON Logic filter. This filter can be used to perform complex filtering by grouping rules.\n\nFor example, using such a filter you can get all resources created by you:\n\n    - {\"and\":[{\"==\":[{\"var\":\"owner\"},\"<user>\"]}]}\n\nDetails about the syntax used can be found at the link: https://jsonlogic.com/\n\n Available filter_fields: ['frame', 'id', 'job_id', 'project_id', 'severity', 'task_id', 'type']."
        schema:
          type: string
      - name: frame
        in: query
        description: A simple equality filter for the frame field
        schema:
          type: integer
      - name: job_id
        in: query
        description: A simple equality filter for the job_id field
        schema:
          type: integer
      - name: org
        in: query
        description: 'Organization unique slug.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A non-empty value selects that organization.

          '
        schema:
          type: string
        allowEmptyValue: true
      - name: org_id
        in: query
        description: 'Organization unique id.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A positive integer selects that organization.

          '
        schema:
          type: integer
        allowEmptyValue: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: project_id
        in: query
        description: A simple equality filter for the project_id field
        schema:
          type: integer
      - in: query
        name: report_id
        schema:
          type: integer
        description: A simple equality filter for report id
      - name: severity
        in: query
        description: A simple equality filter for the severity field
        schema:
          type: string
          enum:
          - error
      - name: sort
        required: false
        in: query
        description: 'Which field to use when ordering the results. Available ordering_fields: [''frame'', ''id'', ''job_id'', ''project_id'', ''severity'', ''task_id'', ''type'']'
        schema:
          type: string
      - name: task_id
        in: query
        description: A simple equality filter for the task_id field
        schema:
          type: integer
      - name: type
        in: query
        description: A simple equality filter for the type field
        schema:
          type: string
          enum:
          - missing_annotation
          - extra_annotation
          - mismatching_label
          - mismatching_direction
          - mismatching_attributes
          - mismatching_groups
          - covered_annotation
      tags:
      - quality
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnotationConflictList'
          description: ''
  /api/quality/job_validations:
    get:
      operationId: quality_list_job_validations
      summary: List job validations
      parameters:
      - name: X-Organization
        in: header
        description: 'Organization unique slug.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A non-empty value selects that organization.

          '
        schema:
          type: string
        allowEmptyValue: true
      - name: assignee
        in: query
        description: A simple equality filter for the assignee field
        schema:
          type: integer
      - name: filter
        required: false
        in: query
        description: "\nJSON Logic filter. This filter can be used to perform complex filtering by grouping rules.\n\nFor example, using such a filter you can get all resources created by you:\n\n    - {\"and\":[{\"==\":[{\"var\":\"owner\"},\"<user>\"]}]}\n\nDetails about the syntax used can be found at the link: https://jsonlogic.com/\n\n Available filter_fields: ['assignee', 'id', 'job_id', 'project_id', 'report_id', 'status', 'task_id']."
        schema:
          type: string
      - name: job_id
        in: query
        description: A simple equality filter for the job_id field
        schema:
          type: integer
      - name: org
        in: query
        description: 'Organization unique slug.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A non-empty value selects that organization.

          '
        schema:
          type: string
        allowEmptyValue: true
      - name: org_id
        in: query
        description: 'Organization unique id.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A positive integer selects that organization.

          '
        schema:
          type: integer
        allowEmptyValue: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: project_id
        in: query
        description: A simple equality filter for the project_id field
        schema:
          type: integer
      - name: report_id
        in: query
        description: A simple equality filter for the report_id field
        schema:
          type: integer
      - name: sort
        required: false
        in: query
        description: 'Which field to use when ordering the results. Available ordering_fields: [''id'']'
        schema:
          type: string
      - name: status
        in: query
        description: A simple equality filter for the status field
        schema:
          type: string
          enum:
          - disabled
          - accepted
          - rejected
      - name: task_id
        in: query
        description: A simple equality filter for the task_id field
        schema:
          type: integer
      tags:
      - quality
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/PaginatedJobValidationList'
          description: ''
    post:
      operationId: quality_create_validation
      description: 'The endpoint can be used this way:


        request_data = {"job_id": 42}

        response = post(body=request_data)

        if response.status == 200:

        return response.data["status"] # likely, "disabled"


        rq_id = response.data["rq_id"]

        while True:

        response = get(f"/api/requests/{rq_id}")

        background_request = json.loads(response.data)

        if background_request["status"] == "finished":

        return background_request

        elif background_request["status"] == "failed":

        raise Exception(background_request["message"])


        Only the last validation request to a job is considered valid. If a new request arrives

        before the previous one is completed, the previous one is considered canceled.

        The attempts counter will be increased regardless of the results being collected.'
      summary: Create a job validation request
      tags:
      - quality
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobValidationCreateRequest'
            examples:
              RequestAJobValidation:
                value:
                  job_id: 42
                summary: Request a job validation
              RequestAJobValidationWithATimeout:
                value:
                  job_id: 42
                  timeout: 30
                summary: Request a job validation with a timeout
                description: 'Here we allow no more than 30 seconds for processing.

                  It''s useful if you want to provide a responsive UI,

                  which doesn''t pollute server with unnecessary requests.

                  The "timeout" parameter will automatically cancel the request,

                  if it''s not processed in the specified time period.

                  '
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/JobValidation'
          description: 'A job validation request has been processed successfully

            without creating an async task.

            Typically this means that job validation is disabled for the job.

            '
        '202':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/RqId'
          description: 'A job validation request has been enqueued, the request id is returned.

            The request status can be checked by using common requests API: `GET /api/requests/<rq_id>`.

            '
        '400':
          description: Invalid or failed request, check the response data for details
  /api/quality/job_validations/{id}:
    get:
      operationId: quality_retrieve_job_validations
      summary: Get job validation details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: An id of a job validation
        required: true
      tags:
      - quality
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/JobValidation'
          description: ''
  /api/quality/reports:
    get:
      operationId: quality_list_reports
      description: 'The "target" parameter is required when the "task_id" or "project_id"

        filter is used.


        The "parent_id" filter requires the "target" parameter. Valid parent

        report target to requested target combinations are: task to job,

        project to task, and project to job.


        Please note that a report can be reused in several parent reports,

        but the "parent_id" field in responses will include only the first parent report id.

        Filtering project report children with target "job" still returns all the relevant

        nested job reports, even though their response "parent_id" values refer to task reports.'
      summary: Method returns a paginated list of quality reports
      parameters:
      - name: X-Organization
        in: header
        description: 'Organization unique slug.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A non-empty value selects that organization.

          '
        schema:
          type: string
        allowEmptyValue: true
      - name: filter
        required: false
        in: query
        description: "\nJSON Logic filter. This filter can be used to perform complex filtering by grouping rules.\n\nFor example, using such a filter you can get all resources created by you:\n\n    - {\"and\":[{\"==\":[{\"var\":\"owner\"},\"<user>\"]}]}\n\nDetails about the syntax used can be found at the link: https://jsonlogic.com/\n\n Available filter_fields: ['created_date', 'gt_last_updated', 'id', 'job_id', 'project_id', 'target_last_updated', 'task_id']."
        schema:
          type: string
      - in: query
        name: include_legacy
        schema:
          type: boolean
          default: false
        description: Include reports stored in the legacy data format
      - name: job_id
        in: query
        description: A simple equality filter for the job_id field
        schema:
          type: integer
      - name: org
        in: query
        description: 'Organization unique slug.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A non-empty value selects that organization.

          '
        schema:
          type: string
        allowEmptyValue: true
      - name: org_id
        in: query
        description: 'Organization unique id.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A positive integer selects that organization.

          '
        schema:
          type: integer
        allowEmptyValue: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: parent_id
        schema:
          type: integer
        description: A parent report id filter. Requires a compatible target filter
      - in: query
        name: project_id
        schema:
          type: integer
        description: A simple equality filter for project id
      - name: sort
        required: false
        in: query
        description: 'Which field to use when ordering the results. Available ordering_fields: [''created_date'', ''gt_last_updated'', ''id'', ''job_id'', ''project_id'', ''target_last_updated'', ''task_id'']'
        schema:
          type: string
      - in: query
        name: target
        schema:
          type: string
          enum:
          - job
          - project
          - task
        description: A simple equality filter for target
      - in: query
        name: task_id
        schema:
          type: integer
        description: A simple equality filter for task id
      tags:
      - quality
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/PaginatedQualityReportList'
          description: ''
    post:
      operationId: quality_create_report
      description: 'Deprecation warning: Utilizing this endpoint to check the computation status is no longer possible.

        Consider using common requests API: GET /api/requests/'
      summary: Create a quality report
      parameters:
      - in: query
        name: rq_id
        schema:
          type: string
        description: 'The report creation request id. Can be specified to check the report

          creation status.

          '
        deprecated: true
      tags:
      - quality
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualityReportCreateRequest'
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/QualityReport'
          description: ''
        '202':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/RqId'
          description: 'A quality report request has been enqueued, the request id is returned.

            The request status can be checked at this endpoint by passing the rq_id

            as the query parameter. If the request id is specified, this response

            means the quality report request is queued or is being processed.

            '
        '400':
          description: Invalid or failed request, check the response data for details
