  /api/quality/reports/{id}/confusion/matrix:
    get:
      operationId: quality_retrieve_report_requirement_confusion
      summary: Get a quality report requirement confusion matrix
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
          default: json
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this quality report.
        required: true
      - in: query
        name: requirement
        schema:
          type: integer
        description: Quality requirement id in the report
        required: true
      tags:
      - quality
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityReportConfusionMatrix'
            text/csv:
              schema:
                type: string
                format: binary
          description: JSON confusion matrix for the requested quality requirement
        '404':
          description: Requirement confusion matrix was not found
