          $ref: '#/components/schemas/QualityReportRequirementCalculation'
        threshold:
          type: number
          format: double
      required:
      - calculation
      - metric
      - name
      - requirement_id
      - score
      - score_components
      - threshold
    QualityReportScoreComponents:
      type: object
      properties:
        valid_count:
          type: integer
        missing_count:
          type: integer
        extra_count:
          type: integer
      required:
      - extra_count
      - missing_count
      - valid_count
    QualitySettingsRequest:
      type: object
      properties:
        job_filter:
          type: string
          description: 'A JSON-based logic expression used to filter jobs for quality validation.

            The filter supports various terms to specify conditions on job: [''assignee'', ''id'', ''stage'', ''state'', ''task_id'', ''task_name'', ''type'']

            '
          maxLength: 1024
        inherit:
          type: boolean
          description: 'Allow using project settings when computing task quality.

            Only applicable to task quality settings inside projects

            '
        max_validations_per_job:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: 'The maximum number of job validation attempts for the job assignee.

            The job can be automatically accepted if the job quality is above the required

            threshold, defined by the target threshold parameter.

            '
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/QualityRequirementListItemRequest'
    QualityPointSizeBase:
      enum:
      - image_size
      - group_bbox_size
      type: string
      description: '* `image_size` - IMAGE_SIZE

        * `group_bbox_size` - GROUP_BBOX_SIZE'
    ShapeType:
      enum:
      - rectangle
      - polygon
      - polyline
      - points
      - ellipse
      - cuboid
      - mask
      - skeleton
      type: string
      description: '* `rectangle` - RECTANGLE

        * `polygon` - POLYGON

        * `polyline` - POLYLINE

        * `points` - POINTS

        * `ellipse` - ELLIPSE

        * `cuboid` - CUBOID

        * `mask` - MASK

        * `skeleton` - SKELETON'
    JobValidationCreateRequest:
      type: object
      properties:
        job_id:
          type: integer
          writeOnly: true
        timeout:
          type:
          - integer
          - 'null'
          writeOnly: true
      required:
      - job_id
    AttributeComparison:
      type: object
      properties:
        default:
          allOf:
          - $ref: '#/components/schemas/AttributeComparisonDefaultRule'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AttributeComparisonRule'
    PaginatedQualityReportList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/QualityReport'
    QualityReportTargetMetricSummaryMetricEnum:
      enum:
      - accuracy
      - precision
      - recall
      - jaccard_index
      - dice
      type: string
      description: '* `accuracy` - accuracy

        * `precision` - precision

        * `recall` - recall

        * `jaccard_index` - jaccard_index

        * `dice` - dice'
    QualitySettings:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        task_id:
          type:
          - integer
          - 'null'
        project_id:
          type:
          - integer
          - 'null'
        job_filter:
          type: string
          description: 'A JSON-based logic expression used to filter jobs for quality validation.

            The filter supports various terms to specify conditions on job: [''assignee'', ''id'', ''stage'', ''state'', ''task_id'', ''task_name'', ''type'']

            '
          maxLength: 1024
        inherit:
          type: boolean
          description: 'Allow using project settings when computing task quality.

            Only applicable to task quality settings inside projects

            '
        max_validations_per_job:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: 'The maximum number of job validation attempts for the job assignee.

            The job can be automatically accepted if the job quality is above the required

            threshold, defined by the target threshold parameter.

            '
        requirements:
          type: array
