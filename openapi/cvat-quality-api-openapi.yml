        panoptic_comparison:
          type:
          - boolean
          - 'null'
          description: 'Use only the visible part of the masks and polygons in comparisons

            '
        attribute_comparison:
          allOf:
          - $ref: '#/components/schemas/AttributeComparisonRequest'
          description: Incremental attribute comparison settings. The default rule applies to attributes without an override; rules override behavior for individual AttributeSpec ids.
    AnnotationConflict:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        frame:
          type: integer
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/AnnotationConflictType'
          readOnly: true
        annotation_ids:
          type: array
          items:
            $ref: '#/components/schemas/AnnotationId'
        report_id:
          type: integer
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/AnnotationConflictSeverity'
          readOnly: true
        attribute_names:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - annotation_ids
    AnnotationTypeEnum:
      enum:
      - tag
      - rectangle
      - skeleton
      - skeleton_keypoint
      - points
      - polyline
      - mask
      - polygon
      - ellipse
      type: string
      description: '* `tag` - Tag

        * `rectangle` - Rectangle

        * `skeleton` - Skeleton

        * `skeleton_keypoint` - Skeleton Keypoint

        * `points` - Points

        * `polyline` - Polyline

        * `mask` - Mask

        * `polygon` - Polygon

        * `ellipse` - Ellipse'
    QualityTargetMetric:
      enum:
      - accuracy
      - precision
      - recall
      - jaccard_index
      - dice
      - mean_accuracy
      - mean_precision
      - mean_recall
      - mean_jaccard_index
      - mean_dice
      - label_accuracy
      - label_precision
      - label_recall
      - label_jaccard_index
      - label_dice
      type: string
      description: '* `accuracy` - ACCURACY

        * `precision` - PRECISION

        * `recall` - RECALL

        * `jaccard_index` - JACCARD_INDEX

        * `dice` - DICE

        * `mean_accuracy` - MEAN_ACCURACY

        * `mean_precision` - MEAN_PRECISION

        * `mean_recall` - MEAN_RECALL

        * `mean_jaccard_index` - MEAN_JACCARD_INDEX

        * `mean_dice` - MEAN_DICE

        * `label_accuracy` - LABEL_ACCURACY

        * `label_precision` - LABEL_PRECISION

        * `label_recall` - LABEL_RECALL

        * `label_jaccard_index` - LABEL_JACCARD_INDEX

        * `label_dice` - LABEL_DICE'
    QualityRequirementBulkCreateNodeRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 250
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        filter:
          type: string
        enabled:
          type: boolean
        annotation_type:
          oneOf:
          - $ref: '#/components/schemas/AnnotationTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        metric:
          description: 'The primary metric used for quality estimation


            * `accuracy` - ACCURACY

            * `precision` - PRECISION

            * `recall` - RECALL

            * `jaccard_index` - JACCARD_INDEX

            * `dice` - DICE

            * `mean_accuracy` - MEAN_ACCURACY

            * `mean_precision` - MEAN_PRECISION

            * `mean_recall` - MEAN_RECALL

            * `mean_jaccard_index` - MEAN_JACCARD_INDEX

            * `mean_dice` - MEAN_DICE

            * `label_accuracy` - LABEL_ACCURACY

            * `label_precision` - LABEL_PRECISION

            * `label_recall` - LABEL_RECALL

            * `label_jaccard_index` - LABEL_JACCARD_INDEX

            * `label_dice` - LABEL_DICE'
          oneOf:
          - $ref: '#/components/schemas/QualityTargetMetric'
          - $ref: '#/components/schemas/NullEnum'
        required_score:
          type:
          - number
          - 'null'
          format: double
          maximum: 1
          minimum: 0
          description: Defines the minimal quality requirements in terms of the selected target metric.
        parent_requirement:
          type:
          - integer
          - 'null'
          description: Required for root requirements and forbidden for nested requirements. Must identify an existing requirement from the selected quality settings.
        iou_threshold:
          type:
          - number
          - 'null'
          format: double
          maximum: 1
          minimum: 0
          description: 'The overlap threshold used for distinction between matched / unmatched objects.

            The specific meaning can vary depending on the shape type:

            for rectangles, polygons, ellipses, lines and masks it''s the IoU threshold;

            for points and skeletons, it''s the OKS threshold.

            '
        point_size:
          type:
          - number
          - 'null'
          format: double
          maximum: 1
          minimum: 0
          description: 'The point "size" (the OKS sigma), as a fraction of the object size, defined by

            the point size base. Corresponds to the standard deviation of the keypoint position.

            Larger values give larger areas around the GT points, where the checked points

            are accepted.

            Read more about the point matching in the documentation.'
        point_size_base:
          description: 'When comparing point annotations (including both separate points and point groups),

            the point size parameter defines matching area for each GT point based to the

            object size. The point size base parameter allows to configure how to determine

            the object size.

            If image_size, the image size is used. Useful if each point

            annotation represents a separate object or boxes grouped with points do not

            represent object boundaries.

            If group_bbox_size, the object size is based on

            the point group bbox size. Useful if each point group represents an object

            or there is a bbox grouped with points, representing the object size.



            * `image_size` - IMAGE_SIZE

            * `group_bbox_size` - GROUP_BBOX_SIZE'
          oneOf:
          - $ref: '#/components/schemas/QualityPointSizeBase'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        line_thickness:
          type:
          - number
          - 'null'
          format: double
          maximum: 1
          minimum: 0
          description: 'Thickness of polylines, relatively to the (image area) ^ 0.5.

            The distance to the boundary around the GT line,

            inside of which the checked line points should be

            '
        match_orientation:
          type:
          - boolean
          - 'null'
          description: Enables or disables polyline orientation comparison
        line_orientation_threshold:
          type:
          - number
          - 'null'
          format: double
          maximum: 1
          minimum: 0
          description: 'The minimal gain in the GT IoU between the given and reversed line directions

            to consider the line inverted.

            Only used when the ''match_orientation'' parameter is true

            '
        match_groups:
          type:
          - boolean
          - 'null'
          description: Enables or disables annotation group checks. Only annotations of the same shape type can form matching groups.
        group_match_threshold:
          type:
          - number
          - 'null'
          format: double
          maximum: 1
          minimum: 0
          description: 'Minimal IoU for groups to be considered matching.

            Only used when the ''match_groups'' parameter is true

            '
        check_covered_annotations:
          type:
          - boolean
          - 'null'
          description: 'Check for partially-covered annotations, useful in segmentation tasks

            '
        object_visibility_threshold:
          type:
          - number
          - 'null'
          format: double
          maximum: 1
          minimum: 0
          description: 'Minimal visible area percent of the spatial annotations (polygons, masks)

            for reporting covered annotations.

            Only used when the ''object_visibility_threshold'' parameter is true

            '
        panoptic_comparison:
          type:
          - boolean
          - 'null'
          description: 'Use only the visible part of the masks and polygons in comparisons

            '
        attribute_comparison:
          allOf:
          - $ref: '#/components/schemas/AttributeComparisonRequest'
          description: Incremental attribute comparison settings. The default rule applies to attributes without an override; rules override behavior for individual AttributeSpec ids.
        children:
          type: array
          items:
            $ref: '#/components/schemas/QualityRequirementBulkCreateNodeRequest'
          description: Nested requirements to create. Their parent is determined by their position in the hierarchy.
      required:
      - name
