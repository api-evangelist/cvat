openapi: 3.2.0
info:
  title: CVAT REST Tasks API
  version: 2.79.0 (2.0)
  description: REST API for Computer Vision Annotation Tool (CVAT)
  termsOfService: https://www.google.com/policies/terms/
  contact:
    name: CVAT.ai team
    url: https://github.com/cvat-ai/cvat
    email: support@cvat.ai
  license:
    name: MIT License
    url: https://en.wikipedia.org/wiki/MIT_License
tags:
- name: Tasks
paths:
  /api/tasks:
    get:
      operationId: tasks_list
      summary: List tasks
      parameters:
      - name: X-Organization
        in: header
        description: 'Organization unique slug.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A non-empty value selects that organization.

          '
        schema:
          type: string
        allowEmptyValue: true
      - name: assignee
        in: query
        description: A simple equality filter for the assignee field
        schema:
          type: string
      - name: dimension
        in: query
        description: A simple equality filter for the dimension field
        schema:
          type: string
          enum:
          - 1d
          - 2d
          - 3d
      - name: filter
        required: false
        in: query
        description: "\nJSON Logic filter. This filter can be used to perform complex filtering by grouping rules.\n\nFor example, using such a filter you can get all resources created by you:\n\n    - {\"and\":[{\"==\":[{\"var\":\"owner\"},\"<user>\"]}]}\n\nDetails about the syntax used can be found at the link: https://jsonlogic.com/\n\n Available filter_fields: ['assignee', 'created_date', 'dimension', 'id', 'media_type', 'mode', 'name', 'owner', 'project_id', 'project_name', 'status', 'subset', 'tracker_link', 'updated_date', 'validation_mode'].\n\nThere are few examples for complex filtering tasks:\n\n    - Get all tasks from 1,2,3 projects - { \"and\" : [{ \"in\" : [{ \"var\" : \"project_id\" }, [1, 2, 3]]}]}\n\n    - Get all completed tasks from 1 project - { \"and\": [{ \"==\": [{ \"var\" : \"status\" }, \"completed\"]}, { \"==\" : [{ \"var\" : \"project_id\"}, 1]}]}\n\n"
        schema:
          type: string
      - name: media_type
        in: query
        description: A simple equality filter for the media_type field
        schema:
          type: string
          enum:
          - image
          - point_cloud
          - audio
      - name: mode
        in: query
        description: A simple equality filter for the mode field
        schema:
          type: string
          enum:
          - annotation
          - interpolation
      - name: name
        in: query
        description: A simple equality filter for the name field
        schema:
          type: string
      - name: org
        in: query
        description: 'Organization unique slug.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A non-empty value selects that organization.

          '
        schema:
          type: string
        allowEmptyValue: true
      - name: org_id
        in: query
        description: 'Organization unique id.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A positive integer selects that organization.

          '
        schema:
          type: integer
        allowEmptyValue: true
      - name: owner
        in: query
        description: A simple equality filter for the owner field
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: project_id
        in: query
        description: A simple equality filter for the project_id field
        schema:
          type: integer
      - name: project_name
        in: query
        description: A simple equality filter for the project_name field
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: 'A search term. Available search_fields: [''assignee'', ''name'', ''owner'', ''project_name'', ''subset'', ''tracker_link'']'
        schema:
          type: string
      - name: sort
        required: false
        in: query
        description: 'Which field to use when ordering the results. Available ordering_fields: [''assignee'', ''created_date'', ''dimension'', ''id'', ''media_type'', ''mode'', ''name'', ''owner'', ''project_id'', ''project_name'', ''status'', ''subset'', ''tracker_link'', ''updated_date'', ''validation_mode'']'
        schema:
          type: string
      - name: status
        in: query
        description: A simple equality filter for the status field
        schema:
          type: string
          enum:
          - annotation
          - validation
          - completed
      - name: subset
        in: query
        description: A simple equality filter for the subset field
        schema:
          type: string
      - name: tracker_link
        in: query
        description: A simple equality filter for the tracker_link field
        schema:
          type: string
      - name: validation_mode
        in: query
        description: A simple equality filter for the validation_mode field
        schema:
          type: string
          enum:
          - gt
          - gt_pool
      tags:
      - Tasks
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskReadList'
          description: ''
    post:
      operationId: tasks_create
      description: 'The new task will not have any attached images or videos.

        To attach them, use the /api/tasks//data endpoint.'
      summary: Create a task
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: 'Organization unique slug.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A non-empty value selects that organization.

          '
      - in: query
        name: org
        schema:
          type: string
        description: 'Organization unique slug.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A non-empty value selects that organization.

          '
      - in: query
        name: org_id
        schema:
          type: integer
        description: 'Organization unique id.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A positive integer selects that organization.

          '
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskWriteRequest'
        required: true
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/TaskRead'
          description: ''
  /api/tasks/{id}:
    get:
      operationId: tasks_retrieve
      summary: Get task details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/TaskRead'
          description: ''
    patch:
      operationId: tasks_partial_update
      summary: Update a task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskWriteRequest'
            examples:
              UpdateTaskProperties:
                value:
                  name: string
                  owner_id: 0
                  assignee_id: 0
                  bug_tracker: string
                  subset: string
                  target_storage:
                    location: cloud_storage
                    cloud_storage_id: 0
                  source_storage:
                    location: cloud_storage
                    cloud_storage_id: 0
                summary: Update task properties
              UpdateTaskLabels:
                value:
                  labels:
                  - name: string
                    color: string
                    attributes: []
                    deleted: false
                    type: any
                    svg: string
                    sublabels:
                    - name: string
                      color: string
                      attributes: []
                      type: any
                      has_parent: true
                summary: Update task labels
              MoveTaskToAProject:
                value:
                  project_id: 0
                summary: Move task to a project
              TransferTaskToPersonalSandbox:
                value:
                  organization_id: null
                summary: Transfer task to personal sandbox
              TransferTaskToOrganization:
                value:
                  organization_id: 1
                summary: Transfer task to organization
              TransferAStorageLinkedTaskToAnOrganizationAndDetachStorages:
                value:
                  organization_id: 1
                  source_storage:
                    location: local
                    cloud_storage_id: null
                  target_storage:
                    location: local
                    cloud_storage_id: null
                summary: Transfer a storage linked task to an organization and detach storages
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/TaskRead'
          description: ''
    delete:
      operationId: tasks_destroy
      description: All attached jobs, annotations and data will be deleted as well.
      summary: Delete a task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '204':
          description: The task has been deleted
  /api/tasks/{id}/annotations/:
    get:
      operationId: tasks_retrieve_annotations
      summary: Get task annotations
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/LabeledData'
          description: ''
        '400':
          description: Exporting without data is not allowed
        '410':
          description: API endpoint no longer handles exporting process
    post:
      operationId: tasks_create_annotations
      description: 'The request POST /api/tasks/id/annotations initiates a background process to import annotations into a task.

        Please, use the GET /api/requests/ endpoint for checking status of the process.

        The `rq_id` parameter can be found in the response on initiating request.'
      summary: Import annotations into a task
      parameters:
      - in: query
        name: cloud_storage_id
        schema:
          type: integer
        description: Storage id
      - in: query
        name: filename
        schema:
          type: string
        description: Annotation file name
      - in: query
        name: format
        schema:
          type: string
        description: 'Input format name

          You can get the list of supported formats at:

          /server/annotation/formats'
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      - in: query
        name: import_mode
        schema:
          type: string
          enum:
          - append
          - replace
          default: replace
        description: How to import annotations
      - in: query
        name: location
        schema:
          type: string
          enum:
          - cloud_storage
          - local
        description: where to import the annotation from
      - in: query
        name: use_default_location
        schema:
          type: boolean
          default: true
        description: Use the location that was configured in task to import annotations
        deprecated: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnotationFileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnnotationFileRequest'
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '201':
          description: Uploading has finished
        '202':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/RqId'
          description: Uploading has been started
        '405':
          description: Format is not available
    put:
      operationId: tasks_update_annotations
      summary: Replace task annotations
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabeledDataRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LabeledDataRequest'
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          description: Annotations have been replaced
    patch:
      operationId: tasks_partial_update_annotations
      summary: Update task annotations
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - create
          - delete
          - update
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLabeledDataRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLabeledDataRequest'
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/LabeledData'
          description: ''
    delete:
      operationId: tasks_destroy_annotations
      summary: Delete task annotations
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '204':
          description: The annotation has been deleted
  /api/tasks/{id}/backup/export:
    post:
      operationId: tasks_create_backup_export
      description: 'The request `POST /api//id/backup/export` will initialize

        a background process to backup a resource. To check status of the process

        please, use `GET /api/requests/` where **rq_id** is request ID returned in the response for this endpoint.'
      summary: Initiate process to backup resource
      parameters:
      - in: query
        name: cloud_storage_id
        schema:
          type: integer
        description: Storage id
      - in: query
        name: filename
        schema:
          type: string
        description: Backup file name
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      - in: query
        name: lightweight
        schema:
          type: boolean
          default: true
        description: Makes a lightweight backup (without media files) for tasks whose media is located in cloud storage
      - in: query
        name: location
        schema:
          type: string
          enum:
          - cloud_storage
          - local
        description: Where need to save downloaded backup
      tags:
      - Tasks
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '202':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/RqId'
          description: Creating a backup file has been started
        '400':
          description: Wrong query parameters were passed
        '409':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/RqId'
          description: The backup process has already been initiated and is not yet finished
  /api/tasks/{id}/data/:
    get:
      operationId: tasks_retrieve_data
      summary: Get data of a task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      - in: query
        name: number
        schema:
          type: integer
        description: A unique number value identifying chunk or frame
      - in: query
        name: quality
        schema:
          type: string
          enum:
          - compressed
          - original
        description: Specifies the quality level of the requested data
      - in: query
        name: type
        schema:
          type: string
          enum:
          - chunk
          - context_image
          - frame
        description: Specifies the type of the requested data
        required: true
      tags:
      - Tasks
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          headers:
            X-Checksum:
              schema:
                type: string
              description: Data checksum, applicable for chunks only
            X-Chunk-Size:
              schema:
                type: integer
              description: Decoded chunk size in bytes, applicable for chunks only
            X-Updated-Date:
              schema:
                type: string
                format: date-time
              description: Data update date, applicable for chunks only
          description: Data of a specific type
        '206':
          headers:
            X-Checksum:
              schema:
                type: string
              description: Data checksum, applicable for chunks only
            X-Chunk-Size:
              schema:
                type: integer
              description: Decoded chunk size in bytes, applicable for chunks only
            X-Updated-Date:
              schema:
                type: string
                format: date-time
              description: Data update date, applicable for chunks only
          description: Partial chunk data
        '416':
          headers:
            X-Chunk-Size:
              schema:
                type: integer
              description: Decoded chunk size in bytes, applicable for chunks only
          description: Requested range is not satisfiable
    post:
      operationId: tasks_create_data
      description: 'Allows to upload data (images, video, etc.) to a task.

        Supports the TUS open file uploading protocol (https://tus.io/).


        Supports the following protocols:


        1. A single Data request


        and


        2.1. An Upload-Start request

        2.2.a. Regular TUS protocol requests (Upload-Length + Chunks)

        2.2.b. Upload-Multiple requests

        2.3. An Upload-Finish request


        Requests:

        - Data - POST, no extra headers or ''Upload-Start'' + ''Upload-Finish'' headers.

        Contains data in the body.

        - Upload-Start - POST, has an ''Upload-Start'' header. No body is expected.

        - Upload-Length - POST, has an ''Upload-Length'' header (see the TUS specification)

        - Chunk - HEAD/PATCH (see the TUS specification). Sent to /data/ endpoints.

        - Upload-Finish - POST, has an ''Upload-Finish'' header. Can contain data in the body.

        - Upload-Multiple - POST, has an ''Upload-Multiple'' header. Contains data in the body.


        The ''Upload-Finish'' request allows to specify the uploaded files should be ordered.

        This may be needed if the files can be sent unordered. To state that the input files

        are sent ordered, pass an empty list of files in the ''upload_file_order'' field.

        If the files are sent unordered, the ordered file list is expected

        in the ''upload_file_order'' field. It must be a list of string file paths,

        relative to the dataset root.


        Example:

        files = [

        "cats/cat_1.jpg",

        "dogs/dog2.jpg",

        "image_3.png",

        ...

        ]


        Independently of the file declaration field used

        (''client_files'', ''server_files'', etc.), when the ''predefined''

        sorting method is selected, the uploaded files will be ordered according

        to the ''.jsonl'' manifest file, if it is found in the list of files.

        For archives (e.g. ''.zip''), a manifest file (''*.jsonl'') is required when using

        the ''predefined'' file ordering. Such file must be provided next to the archive

        in the list of files. Read more about manifest files here:

        https://docs.cvat.ai/docs/manual/advanced/dataset_manifest/


        After all data is sent, the operation status can be retrieved via

        the `GET /api/requests/`, where **rq_id** is request ID returned for this request.


        Once data is attached to a task, it cannot be detached or replaced.'
      summary: Attach data to a task
      parameters:
      - in: header
        name: Upload-Finish
        schema:
          type: boolean
        description: Finishes data upload. Can be combined with Upload-Start header to create task data with one request
      - in: header
        name: Upload-Multiple
        schema:
          type: boolean
        description: Indicates that data with this request are single or multiple files that should be attached to a task
      - in: header
        name: Upload-Start
        schema:
          type: boolean
        description: Initializes data upload. Optionally, can include upload metadata in the request body.
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DataRequest'
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '202':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/DataResponse'
          description: Request to attach a data to a task has been accepted
  /api/tasks/{id}/data/meta:
    get:
      operationId: tasks_retrieve_data_meta
      summary: Get metainformation for media files in a task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/DataMetaRead'
          description: ''
    patch:
      operationId: tasks_partial_update_data_meta
      summary: Update metainformation for media files in a task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDataMetaWriteRequest'
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/DataMetaRead'
          description: ''
  /api/tasks/{id}/dataset/export:
    post:
      operationId: tasks_create_dataset_export
      description: 'The request `POST /api//id/dataset/export` will initialize

        a background process to export a dataset. To check status of the process

        please, use `GET /api/requests/` where **rq_id** is request ID returned in the response for this endpoint.'
      summary: Initialize process to export resource as a dataset in a specific format
      parameters:
      - in: query
        name: cloud_storage_id
        schema:
          type: integer
        description: Storage id
      - in: query
        name: filename
        schema:
          type: string
        description: Desired output file name
      - in: query
        name: format
        schema:
          type: string
        description: 'Desired output format name

          You can get the list of supported formats at:

          /server/annotation/formats'
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      - in: query
        name: location
        schema:
          type: string
          enum:
          - cloud_storage
          - local
        description: Where need to save downloaded dataset
      - in: query
        name: save_images
        schema:
          type: boolean
          default: false
        description: Include images or not
      tags:
      - Tasks
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '202':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/RqId'
          description: Exporting has been started
        '405':
          description: Format is not available
        '409':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/RqId'
          description: Exporting is already in progress
  /api/tasks/{id}/preview:
    get:
      operationId: tasks_retrieve_preview
      summary: Get a preview image for a task
      parameters:
      - in: header
        name: Prefer
        schema:
          type: string
        description: RFC 7240 preference token. Send `handling=empty` to receive a 204 No Content response when no media-derived preview exists. Without the preference, the server returns a default placeholder image with status 200.
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          description: Task image preview
        '204':
          description: 'No media-derived preview is available. The client should render a placeholder image. Only returned when the request opts in via `Prefer: handling=empty`.'
        '404':
          description: Task image preview not found
  /api/tasks/{id}/status:
    get:
      operationId: tasks_retrieve_status
      description: 'This method is deprecated and will be removed in one of the next releases. To check status of task creation, use new common API for managing background operations: GET /api/requests/?action=create&task_id='
      summary: Get the creation status of a task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      deprecated: true
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/RqStatus'
          description: ''
  /api/tasks/{id}/validation_layout:
    get:
      operationId: tasks_retrieve_validation_layout
      summary: Allows getting current validation configuration
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/TaskValidationLayoutRead'
          description: ''
    patch:
      operationId: tasks_partial_update_validation_layout
      description: 'WARNING: this operation is not protected from race conditions.

        It''s up to the user to ensure no parallel calls to this operation happen.

        It affects image access, including exports with images, backups, chunk downloading etc.'
      summary: Allows updating current validation configuration
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskValidationLayoutWriteRequest'
            examples:
              SetHoneypotsToRandomValidationFrames:
                value:
                  frame_selection_method: random_uniform
                summary: set honeypots to random validation frames
              SetHoneypotsManually:
                value:
                  frame_selection_method: manual
                  honeypot_real_frames:
                  - 10
                  - 20
                  - 22
                summary: set honeypots manually
              DisableValidationFrames:
                value:
                  disabled_frames:
                  - 4
                  - 5
                  - 8
                summary: disable validation frames
              RestoreAllValidationFrames:
                value:
                  disabled_frames: []
                summary: restore all validation frames
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/TaskValidationLayoutRead'
          description: ''
  /api/tasks/backup/:
    post:
      operationId: tasks_create_backup
      description: 'The backup import process is as follows:


        The first request POST /api/tasks/backup creates a background job on the server

        in which the process of a task creating from an uploaded backup is carried out.


        To check the status of the import process, use GET /api/requests/rq_id,

        where rq_id is the request ID obtained from the response to the previous request.


        Once the import completes successfully, the response will contain the ID

        of the newly created task in the result_id field.'
      summary: Recreate a task from a backup
      parameters:
      - in: header
        name: X-Organization
        schema:
          type: string
        description: 'Organization unique slug.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A non-empty value selects that organization.

          '
      - in: query
        name: cloud_storage_id
        schema:
          type: integer
        description: Storage id
      - in: query
        name: filename
        schema:
          type: string
        description: Backup file name
      - in: query
        name: location
        schema:
          type: string
          enum:
          - cloud_storage
          - local
          default: local
        description: Where to import the backup file from
      - in: query
        name: org
        schema:
          type: string
        description: 'Organization unique slug.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A non-empty value selects that organization.

          '
      - in: query
        name: org_id
        schema:
          type: integer
        description: 'Organization unique id.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A positive integer selects that organization.

          '
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskFileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskFileRequest'
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '202':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/RqId'
          description: Import of the backup file has started
components:
  schemas:
    PatchedDataMetaWriteRequest:
      type: object
