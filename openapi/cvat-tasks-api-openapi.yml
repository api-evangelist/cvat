      description: '* `cloud_storage` - CLOUD_STORAGE

        * `local` - LOCAL

        * `share` - SHARE'
    DataResponse:
      oneOf:
      - $ref: '#/components/schemas/RqId'
      - type: string
        format: binary
    SubLabeledTrackRequest:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
        label_id:
          type: integer
          minimum: 0
        group:
          type:
          - integer
          - 'null'
          minimum: 0
          default: 0
        source:
          type: string
          minLength: 1
          default: manual
        frame:
          type: integer
          minimum: 0
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeValRequest'
          default: []
        shapes:
          type: array
          items:
            $ref: '#/components/schemas/TrackedShapeRequest'
      required:
      - frame
      - label_id
      - shapes
    LocationEnum:
      enum:
      - cloud_storage
      - local
      type: string
      description: '* `cloud_storage` - CLOUD_STORAGE

        * `local` - LOCAL'
    ValidationParamsRequest:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/ValidationMode'
        frame_selection_method:
          $ref: '#/components/schemas/FrameSelectionMethod'
        random_seed:
          type: integer
          minimum: 0
          description: 'The seed value for the random number generator.

            The same value will produce the same frame sets.

            Applicable only to random frame selection methods.

            By default, a random value is used.

            '
        frames:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 1024
          writeOnly: true
          description: 'The list of file names to be included in the validation set.

            Applicable only to the "manual" frame selection method.

            Can only be used for images.

            '
        frame_count:
          type: integer
          minimum: 1
          description: 'The number of frames to be included in the validation set.

            Applicable only to the "random_uniform" frame selection method

            '
        frame_share:
          type: number
          format: double
          description: 'The share of frames to be included in the validation set.

            Applicable only to the "random_uniform" frame selection method

            '
        frames_per_job_count:
          type: integer
          minimum: 1
          description: 'The number of frames to be included in the validation set from each annotation job.

            Applicable only to the "random_per_job" frame selection method

            '
        frames_per_job_share:
          type: number
          format: double
          description: 'The share of frames to be included in the validation set from each annotation job.

            Applicable only to the "random_per_job" frame selection method

            '
      required:
      - mode
    FrameSelectionMethod:
      enum:
      - random_uniform
      - random_per_job
