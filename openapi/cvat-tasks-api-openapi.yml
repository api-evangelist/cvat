          $ref: '#/components/schemas/StorageMethod'
        sorting_method:
          $ref: '#/components/schemas/SortingMethod'
        filename_pattern:
          type:
          - string
          - 'null'
          minLength: 1
          description: 'A filename filter for cloud storage files

            listed in the manifest. Supports fnmatch wildcards.

            Read more: https://docs.python.org/3/library/fnmatch.html

            '
        job_file_mapping:
          type: array
          items:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 1024
          writeOnly: true
          description: "\nRepresents a file-to-job mapping.\nUseful to specify a custom job configuration during task creation.\nThis option is not compatible with most other job split-related options.\nFiles in the jobs must not overlap or repeat.\nJob file mapping files must be a subset of the input files.\nIf directories are specified in server_files, all files obtained by recursive search\nin the specified directories will be used as input files.\nIn case of missing items in the input files, an error will be raised.\n\nExample:\n[\n\n    [\"file1.jpg\", \"file2.jpg\"], # job #1 files\n    [\"file3.png\"], # job #2 files\n    [\"file4.jpg\", \"file5.png\", \"file6.bmp\"], # job #3 files\n]\n"
        upload_file_order:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 1024
          writeOnly: true
          description: 'Allows to specify file order for client_file uploads.

            Only valid with the "predefined" sorting method selected.


            To state that the input files are sent in the correct order,

            pass an empty list.


            If you want to send files in an arbitrary order

            and reorder them afterwards on the server,

            pass the list of file names in the required order.

            '
