openapi: 3.2.0
info:
  title: CVAT REST Jobs API
  version: 2.79.0 (2.0)
  description: REST API for Computer Vision Annotation Tool (CVAT)
  termsOfService: https://www.google.com/policies/terms/
  contact:
    name: CVAT.ai team
    url: https://github.com/cvat-ai/cvat
    email: support@cvat.ai
  license:
    name: MIT License
    url: https://en.wikipedia.org/wiki/MIT_License
tags:
- name: Jobs
paths:
  /api/jobs:
    get:
      operationId: jobs_list
      summary: List jobs
      parameters:
      - name: X-Organization
        in: header
        description: 'Organization unique slug.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A non-empty value selects that organization.

          '
        schema:
          type: string
        allowEmptyValue: true
      - name: assignee
        in: query
        description: A simple equality filter for the assignee field
        schema:
          type: string
      - name: dimension
        in: query
        description: A simple equality filter for the dimension field
        schema:
          type: string
          enum:
          - 1d
          - 2d
          - 3d
      - name: filter
        required: false
        in: query
        description: "\nJSON Logic filter. This filter can be used to perform complex filtering by grouping rules.\n\nFor example, using such a filter you can get all resources created by you:\n\n    - {\"and\":[{\"==\":[{\"var\":\"owner\"},\"<user>\"]}]}\n\nDetails about the syntax used can be found at the link: https://jsonlogic.com/\n\n Available filter_fields: ['assignee', 'dimension', 'id', 'media_type', 'mode', 'parent_job_id', 'project_id', 'project_name', 'stage', 'state', 'task_id', 'task_name', 'type', 'updated_date']."
        schema:
          type: string
      - name: media_type
        in: query
        description: A simple equality filter for the media_type field
        schema:
          type: string
          enum:
          - image
          - point_cloud
          - audio
      - name: mode
        in: query
        description: A simple equality filter for the mode field
        schema:
          type: string
          enum:
          - annotation
          - interpolation
      - name: org
        in: query
        description: 'Organization unique slug.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A non-empty value selects that organization.

          '
        schema:
          type: string
        allowEmptyValue: true
      - name: org_id
        in: query
        description: 'Organization unique id.

          If omitted, results from all organizations available to the user are returned

          (unfiltered). An empty value ("") selects the personal sandbox workspace only.

          A positive integer selects that organization.

          '
        schema:
          type: integer
        allowEmptyValue: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: parent_job_id
        in: query
        description: A simple equality filter for the parent_job_id field
        schema:
          type: integer
      - name: project_id
        in: query
        description: A simple equality filter for the project_id field
        schema:
          type: integer
      - name: project_name
        in: query
        description: A simple equality filter for the project_name field
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: 'A search term. Available search_fields: [''assignee'', ''project_name'', ''task_name'']'
        schema:
          type: string
      - name: sort
        required: false
        in: query
        description: 'Which field to use when ordering the results. Available ordering_fields: [''assignee'', ''dimension'', ''id'', ''media_type'', ''mode'', ''parent_job_id'', ''project_id'', ''project_name'', ''stage'', ''state'', ''task_id'', ''task_name'', ''type'', ''updated_date'']'
        schema:
          type: string
      - name: stage
        in: query
        description: A simple equality filter for the stage field
        schema:
          type: string
          enum:
          - annotation
          - validation
          - acceptance
      - name: state
        in: query
        description: A simple equality filter for the state field
        schema:
          type: string
          enum:
          - new
          - in progress
          - completed
          - rejected
      - name: task_id
        in: query
        description: A simple equality filter for the task_id field
        schema:
          type: integer
      - name: task_name
        in: query
        description: A simple equality filter for the task_name field
        schema:
          type: string
      - name: type
        in: query
        description: A simple equality filter for the type field
        schema:
          type: string
          enum:
          - annotation
          - ground_truth
          - consensus_replica
      tags:
      - Jobs
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/PaginatedJobReadList'
          description: ''
    post:
      operationId: jobs_create
      summary: Create a job
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobWriteRequest'
            examples:
              CreateGtJobWithRandom10Frames:
                value:
                  type: ground_truth
                  task_id: 42
                  frame_selection_method: random_uniform
                  frame_count: 10
                  random_seed: 1
                summary: create gt job with random 10 frames
              CreateGtJobWithRandom15%Frames:
                value:
                  type: ground_truth
                  task_id: 42
                  frame_selection_method: random_uniform
                  frame_share: 0.15
                  random_seed: 1
                summary: create gt job with random 15% frames
              CreateGtJobWith3RandomFramesInEachJob:
                value:
                  type: ground_truth
                  task_id: 42
                  frame_selection_method: random_per_job
                  frames_per_job_count: 3
                  random_seed: 1
                summary: create gt job with 3 random frames in each job
              CreateGtJobWith20%RandomFramesInEachJob:
                value:
                  type: ground_truth
                  task_id: 42
                  frame_selection_method: random_per_job
                  frames_per_job_share: 0.2
                  random_seed: 1
                summary: create gt job with 20% random frames in each job
              CreateGtJobWithManualFrameSelection:
                value:
                  type: ground_truth
                  task_id: 42
                  frame_selection_method: manual
                  frames:
                  - 1
                  - 5
                  - 10
                  - 18
                summary: create gt job with manual frame selection
        required: true
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/JobRead'
          description: ''
  /api/jobs/{id}:
    get:
      operationId: jobs_retrieve
      summary: Get job details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      tags:
      - Jobs
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/JobRead'
          description: ''
    patch:
      operationId: jobs_partial_update
      summary: Update a job
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedJobWriteRequest'
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/JobRead'
          description: ''
    delete:
      operationId: jobs_destroy
      description: 'Related annotations will be deleted as well.


        Please note, that not every job can be removed. Currently,

        it is only available for Ground Truth jobs.'
      summary: Delete a job
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      tags:
      - Jobs
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '204':
          description: The job has been deleted
  /api/jobs/{id}/annotations/:
    get:
      operationId: jobs_retrieve_annotations
      description: 'Deprecation warning:


        Utilizing this endpoint to export job dataset in a specific format

        is no longer possible.


        Consider using new API:

        - `POST /api/jobs//dataset/export?save_images=True` to initiate export process

        - `GET /api/requests/` to check process status,

        where `rq_id` is request id returned on initializing request

        - `GET result_url` to download a prepared file,

        where `result_url` can be found in the response on checking status request'
      summary: Get job annotations
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: This parameter is no longer supported
        deprecated: true
      - in: query
        name: cloud_storage_id
        schema:
          type: integer
        description: This parameter is no longer supported
        deprecated: true
      - in: query
        name: filename
        schema:
          type: string
        description: This parameter is no longer supported
        deprecated: true
      - in: query
        name: format
        schema:
          type: string
        description: This parameter is no longer supported
        deprecated: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      - in: query
        name: location
        schema:
          type: string
          enum:
          - cloud_storage
          - local
        description: This parameter is no longer supported
        deprecated: true
      tags:
      - Jobs
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/LabeledData'
          description: ''
        '410':
          description: API endpoint no longer handles dataset exporting process
    post:
      operationId: jobs_create_annotations
      description: 'The request POST /api/jobs/id/annotations initiates a background process to import annotations into a job.

        Please, use the GET /api/requests/ endpoint for checking status of the process.

        The `rq_id` parameter can be found in the response on initiating request.'
      summary: Import annotations into a job
      parameters:
      - in: query
        name: cloud_storage_id
        schema:
          type: integer
        description: Storage id
      - in: query
        name: filename
        schema:
          type: string
        description: Annotation file name
      - in: query
        name: format
        schema:
          type: string
        description: 'Input format name

          You can get the list of supported formats at:

          /server/annotation/formats'
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      - in: query
        name: import_mode
        schema:
          type: string
          enum:
          - append
          - replace
          default: replace
        description: How to import annotations
      - in: query
        name: location
        schema:
          type: string
          enum:
          - cloud_storage
          - local
        description: where to import the annotation from
      - in: query
        name: use_default_location
        schema:
          type: boolean
          default: true
        description: Use the location that was configured in the task to import annotation
        deprecated: true
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnotationFileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnnotationFileRequest'
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '201':
          description: Uploading has finished
        '202':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/RqId'
          description: Uploading has been started
        '405':
          description: Format is not available
    put:
      operationId: jobs_update_annotations
      summary: Replace job annotations
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabeledDataRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LabeledDataRequest'
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          description: Annotations have been replaced
    patch:
      operationId: jobs_partial_update_annotations
      summary: Update job annotations
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - create
          - delete
          - update
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLabeledDataRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLabeledDataRequest'
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          description: Annotations successfully uploaded
    delete:
      operationId: jobs_destroy_annotations
      summary: Delete job annotations
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      tags:
      - Jobs
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '204':
          description: The annotation has been deleted
  /api/jobs/{id}/data:
    get:
      operationId: jobs_retrieve_data
      summary: Get data of a job
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      - in: query
        name: index
        schema:
          type: integer
        description: A unique number value identifying chunk, starts from 0 for each job
      - in: query
        name: number
        schema:
          type: integer
        description: A unique number value identifying chunk or frame. The numbers are the same as for the task. Deprecated for chunks in favor of 'index'
      - in: query
        name: quality
        schema:
          type: string
          enum:
          - compressed
          - original
        description: Specifies the quality level of the requested data
      - in: query
        name: type
        schema:
          type: string
          enum:
          - chunk
          - context_image
          - frame
        description: Specifies the type of the requested data
        required: true
      tags:
      - Jobs
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          headers:
            X-Checksum:
              schema:
                type: string
              description: Data checksum, applicable for chunks only
            X-Chunk-Size:
              schema:
                type: integer
              description: Decoded chunk size in bytes, applicable for chunks only
            X-Updated-Date:
              schema:
                type: string
                format: date-time
              description: Data update date, applicable for chunks only
          content:
            application/vnd.cvat+json:
              schema:
                type: string
                format: binary
          description: Data of a specific type
        '206':
          headers:
            X-Checksum:
              schema:
                type: string
              description: Data checksum, applicable for chunks only
            X-Chunk-Size:
              schema:
                type: integer
              description: Decoded chunk size in bytes, applicable for chunks only
            X-Updated-Date:
              schema:
                type: string
                format: date-time
              description: Data update date, applicable for chunks only
          content:
            application/vnd.cvat+json:
              schema:
                type: string
                format: binary
          description: Partial chunk data
        '416':
          headers:
            X-Chunk-Size:
              schema:
                type: integer
              description: Decoded chunk size in bytes, applicable for chunks only
          description: Requested range is not satisfiable
  /api/jobs/{id}/data/meta:
    get:
      operationId: jobs_retrieve_data_meta
      summary: Get metainformation for media files in a job
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      tags:
      - Jobs
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/DataMetaRead'
          description: ''
    patch:
      operationId: jobs_partial_update_data_meta
      summary: Update metainformation for media files in a job
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedJobDataMetaWriteRequest'
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/DataMetaRead'
          description: ''
  /api/jobs/{id}/dataset/export:
    post:
      operationId: jobs_create_dataset_export
      description: 'The request `POST /api//id/dataset/export` will initialize

        a background process to export a dataset. To check status of the process

        please, use `GET /api/requests/` where **rq_id** is request ID returned in the response for this endpoint.'
      summary: Initialize process to export resource as a dataset in a specific format
      parameters:
      - in: query
        name: cloud_storage_id
        schema:
          type: integer
        description: Storage id
      - in: query
        name: filename
        schema:
          type: string
        description: Desired output file name
      - in: query
        name: format
        schema:
          type: string
        description: 'Desired output format name

          You can get the list of supported formats at:

          /server/annotation/formats'
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      - in: query
        name: location
        schema:
          type: string
          enum:
          - cloud_storage
          - local
        description: Where need to save downloaded dataset
      - in: query
        name: save_images
        schema:
          type: boolean
          default: false
        description: Include images or not
      tags:
      - Jobs
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '202':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/RqId'
          description: Exporting has been started
        '405':
          description: Format is not available
        '409':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/RqId'
          description: Exporting is already in progress
  /api/jobs/{id}/preview:
    get:
      operationId: jobs_retrieve_preview
      summary: Get a preview image for a job
      parameters:
      - in: header
        name: Prefer
        schema:
          type: string
        description: RFC 7240 preference token. Send `handling=empty` to receive a 204 No Content response when no media-derived preview exists. Without the preference, the server returns a default placeholder image with status 200.
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      tags:
      - Jobs
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          description: Job image preview
        '204':
          description: 'No media-derived preview is available. The client should render a placeholder image. Only returned when the request opts in via `Prefer: handling=empty`.'
  /api/jobs/{id}/validation_layout:
    get:
      operationId: jobs_retrieve_validation_layout
      summary: Allows getting current validation configuration
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      tags:
      - Jobs
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/JobValidationLayoutRead'
          description: ''
    patch:
      operationId: jobs_partial_update_validation_layout
      description: 'WARNING: this operation is not protected from race conditions.

        It''s up to the user to ensure no parallel calls to this operation happen.

        It affects image access, including exports with images, backups, chunk downloading etc.'
      summary: Allows updating current validation configuration
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this job.
        required: true
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedJobValidationLayoutWriteRequest'
            examples:
              SetHoneypotsToRandomValidationFrames:
                value:
                  frame_selection_method: random_uniform
                summary: set honeypots to random validation frames
              SetHoneypotsManually:
                value:
                  frame_selection_method: manual
                  honeypot_real_frames:
                  - 10
                  - 20
                  - 22
                summary: set honeypots manually
      security:
      - tokenAuth: []
      - accessTokenAuth: []
      - sessionAuth: []
        csrfAuth: []
        csrfHeaderAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/vnd.cvat+json:
              schema:
                $ref: '#/components/schemas/JobValidationLayoutRead'
          description: ''
components:
  schemas:
    StorageType:
      enum:
      - cloud_storage
      - local
      - share
      type: string
      description: '* `cloud_storage` - CLOUD_STORAGE

        * `local` - LOCAL

        * `share` - SHARE'
    SubLabeledTrackRequest:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
        label_id:
          type: integer
          minimum: 0
        group:
          type:
          - integer
          - 'null'
          minimum: 0
          default: 0
        source:
          type: string
          minLength: 1
          default: manual
        frame:
          type: integer
          minimum: 0
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeValRequest'
          default: []
        shapes:
          type: array
          items:
            $ref: '#/components/schemas/TrackedShapeRequest'
      required:
      - frame
      - label_id
      - shapes
    LocationEnum:
      enum:
      - cloud_storage
      - local
      type: string
      description: '* `cloud_storage` - CLOUD_STORAGE

        * `local` - LOCAL'
    PatchedJobValidationLayoutWriteRequest:
      type: object
      properties:
        frame_selection_method:
          allOf:
          - $ref: '#/components/schemas/FrameSelectionMethod'
          description: 'The method to use for frame selection of new real frames for honeypots in the job



            * `random_uniform` - RANDOM_UNIFORM

            * `random_per_job` - RANDOM_PER_JOB

            * `manual` - MANUAL'
        honeypot_real_frames:
          type: array
          items:
            type: integer
            minimum: 0
          description: 'The list of frame ids. Applicable only to the "manual" frame selection method

            '
    FrameSelectionMethod:
      enum:
      - random_uniform
      - random_per_job
      - manual
      type: string
